[package]
name = "mayna"
version = "0.1.0"
edition = "2024"
description = "Firmware distribution package format for Cunda project"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
defmt-decoder = "1.1.0"
object = { version = "0.39.1", default-features = false, features = ["read", "elf"] }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
clap = { version = "4.6.1", features = ["derive"] }
shell-words = "1.1.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
time = "0.3.47"
