[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard-rpc = "0.12.1"
postcard-schema = { version = "0.2.5", features = ["chrono-v0_4", "heapless-v0_9"] }
serde = { version = "1.0.228", default-features = false }

frb_prpc_juggle = { path = "../frb_prpc_juggle", optional = true }
postcard = { version = "1.1.3" }
pastey = "0.2.1"
heapless = { version = "0.9.2", features = ["serde"] }

chrono = { version = "0.4", optional = true }
nmea_ubx_gps = { path = "../nmea_ubx_gps" }


flutter_rust_bridge = { version = "=2.11.1", optional = true }
[features]
flutter = [ "dep:frb_prpc_juggle", "dep:chrono", "dep:flutter_rust_bridge"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
