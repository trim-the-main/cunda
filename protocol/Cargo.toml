[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard-rpc = "0.12.1"
postcard-schema = { version = "0.2.5", features = ["heapless-v0_9"] }
serde = { version = "1.0.228", default-features = false }

frb_prpc_juggle = { path = "../frb_prpc_juggle", optional = true }
postcard = { version = "1.1.3" }
pastey = "0.2.1"
heapless = { version = "0.9.2", features = ["serde"] }

[features]
flutter = ["dep:frb_prpc_juggle"]
