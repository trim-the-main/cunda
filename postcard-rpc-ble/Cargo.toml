[package]
name = "postcard-rpc-ble"
version = "0.1.0"
edition = "2024"

[dependencies]
bt-hci = "0.6.0"
cobs_accumulator = { path = "../cobs_accumulator" }
critical-section = "1.2.0"
defmt = "1.0.1"
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
maitake-sync = { version = "0.3.0", default-features = false, features = ["critical-section"] }
postcard = { version = "1.1.3", features = ["alloc"] }
postcard-rpc = { git = "https://github.com/trim-the-main/postcard-rpc", features = [
  "cobs",
  "defmt",
  "embedded-io-async-0_6-executor-0_10-server",
] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
static_cell = "2.1.1"
trouble-host = { version = "0.6.0", features = ["default-packet-pool-mtu-255", "defmt", "gatt", "peripheral"] }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
