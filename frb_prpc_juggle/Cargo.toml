[package]
name = "frb_prpc_juggle"
version = "0.1.0"
edition = "2024"

[dependencies]
cobs = { version = "0.5.0", features = ["use_std"] }
cobs_accumulator = { path = "../cobs_accumulator" }
maitake-sync = "0.3.0"
postcard = "1.1.3"
postcard-rpc = { version = "0.12.1", features = ["use-std"] }
postcard-schema = "0.2.5"
serde = { version = "1.0.228", default-features = false }
log = "0.4.28"
tokio = { version = "1.48.0", features = ["time", "rt", "sync"] }
