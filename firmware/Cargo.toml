[package]
name = "firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "firmware"
path = "./src/bin/main.rs"

[dependencies]
bt-hci = "0.6.0"
cobs_accumulator = { path = "../cobs_accumulator" }
cordyceps = "0.3.4"
critical-section = "1.2.0"
defmt = "1.0.1"
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = ["defmt", "trace"] }
# thiserror = { version = "2.0.17", default-features = false }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embedded-storage = "0.3.1"
embedded-storage-async = { version = "0.4.1" }
esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-backtrace = { version = "0.18.1", features = [
  "defmt",
  "esp32",
  "panic-handler",
] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32"] }
esp-hal = { version = "~1.0", features = ["defmt", "esp32", "unstable"] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32"] }
esp-radio = { version = "0.17.0", features = [
  "ble",
  "defmt",
  "esp-alloc",
  "esp32",
  "unstable",
] }
esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
] }
esp-storage = { version = "0.8.1", features = ["defmt", "esp32"] }
frb_prpc_juggle = { path = "../frb_prpc_juggle", default-features = false }
heapless = "0.9.2"
maitake-sync = { version = "0.3.0", default-features = false, features = [
  "critical-section",
] }
minicbor = { version = "2.2.0", features = ["derive"] }
minicbor-adapters = "0.0.8"
minicbor-derive = "0.19.2"
nb = "1.1.0"
postcard = { version = "1.1.3", features = ["alloc"] }
postcard-rpc = { version = "0.12.1", features = [
  "cobs",
  "defmt",
  "embedded-io-async-0_6-server",
] }
protocol = { path = "../protocol" }  # Endpoint and Topic definitions
sequential-storage = { version = "7.1.0", features = [
  "alloc",
  "defmt",
] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
static_cell = "2.1.1"
trouble-host = { version = "0.5.1", features = [
  "default-packet-pool-mtu-255",
  "defmt",
  "gatt",
  "peripheral",
] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
opt-level = "s"
debug = 2
debug-assertions = false
overflow-checks = false
lto = "fat"
incremental = false
codegen-units = 1  # LLVM can perform better optimizations using a single thread
